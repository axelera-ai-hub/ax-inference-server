axelera-model-format: 1.0.0

name: facenet-embeddings-onnx

description: >
  FaceNet (InceptionResnetV1, vggface2 weights) -- same weights as the SDK
  zoo's facenet-lfw-onnx, but with a plain `decodeembeddings` postprocess
  (libdecode_embeddings.so -> AxMetaEmbeddings) instead of `recognition`
  (which does LFW-gallery nearest-neighbor matching against embeddings.json).
  This variant exists to get the RAW 512-dim embedding vector back per crop,
  not a "closest known face" match -- needed for a detect->pose->face->embed
  cascade where the embedding itself is the useful output, not a name.

  Lives outside .sdk/voyager-sdk/ (a from-scratch-regenerable SDK install --
  deleting and rebuilding it is an established reproducibility check in this
  project, see .no_git_program_doc/program_doc_inf_server.md) so this
  variant survives that. Registered with the SDK via a customers/ symlink
  at bring-up time (same mechanism as server/models/mobilenet_color_det/,
  see .runner/01_port_mobilenet_color_v0.yaml's 02_register_with_sdk step)
  rather than by placing this file inside ax_models/ directly.

pipeline:
  - embeddings:
      model_name: facenet-embeddings-onnx
      input:
        type: image
      preprocess:
        - resize:
            height: 192
            width: 192
        - centercrop:
            height: 160
            width: 160
        - torch-totensor:
        - normalize:
            mean: 0.5, 0.5, 0.5
            std: 0.501960784, 0.501960784, 0.501960784
      postprocess:
        - decodeembeddings:

models:
  facenet-embeddings-onnx:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: weights/facenet.onnx
    weight_url: https://media.axelera.ai/artifacts/model_cards/weights/face_recognition/facenet.onnx
    weight_md5: 04028f41a6781c49cb7e98de92e96bc1
    task_category: FaceRecognition
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 160, 160]
    input_color_format: RGB
    num_classes: 3131
    dataset: LFWTorchvisionPair

datasets:
  LFWTorchvisionPair:
    class: TorchvisionPairValidationDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/torchvision.py
    dataset_name: LFWPairs
    data_dir_name: LFW
    image_set: deepfunneled
